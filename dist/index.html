<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="Hold a palm for confetti or a peace sign for balloons.">
  <title>Handparty</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237452e9'/%3E%3Ctext x='10' y='47' font-size='43'%3E✋%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="camera-icon" viewBox="0 0 24 24"><path d="M14.5 8.5 20 5.5v13l-5.5-3M4 5.5h8.5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="hand-icon" viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v6-8a1.5 1.5 0 0 1 3 0v8-6a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v7a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.7-2.3L4 14a1.6 1.6 0 0 1 2.4-2.1L8 14"/></symbol>
    <symbol id="mirror-icon" viewBox="0 0 24 24"><path d="M12 3v18M8 6 3 18h5V6ZM16 6l5 12h-5V6Z"/></symbol>
    <symbol id="expand-icon" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="clear-icon" viewBox="0 0 24 24"><path d="m15 4 6 6-10 10H6l-4-4L15 4ZM9 10l6 6M11 20h11"/></symbol>
    <symbol id="stop-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  </svg>
  <div class="page">
    <header class="site-header">
      <a href="./" class="brand" aria-label="Handparty home"><svg aria-hidden="true"><use href="#hand-icon"/></svg>handparty<span>.</span></a>
      <button id="helpButton" class="help-button" aria-label="Gesture guide">?</button>
    </header>
    <main aria-label="Camera playground">
      <section class="camera-workspace" aria-label="Camera and reactions">
        <div class="stage" id="stage">
          <video id="video" autoplay muted playsinline class="mirrored" aria-label="Your live camera feed"></video>
          <span id="cameraStatus" class="camera-status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="cameraStatusText">Camera off</span></span>
          <button id="cameraButton" class="camera-stop" disabled aria-label="Stop camera" title="Stop camera"><svg aria-hidden="true"><use href="#stop-icon"/></svg></button>
          <div class="empty-state" id="emptyState">
            <svg class="empty-camera" aria-hidden="true"><use href="#camera-icon"/></svg>
            <button id="startButton" class="primary-button"><span>Start camera</span></button>
            <p id="cameraMessage" role="status">Hold ✋ or ✌️ to play</p>
          </div>
          <canvas id="effects" aria-hidden="true"></canvas>
          <div id="reactionToast" class="reaction-toast" role="status"></div>
          <div class="tracking-status" id="trackingStatus" hidden><span id="trackingText">Hold ✋ or ✌️</span><div class="hold-track" id="holdTrack" hidden><div id="holdProgress"></div></div></div>
        </div>
        <div class="reaction-controls" aria-label="Tap to play a reaction">
          <button class="reaction-button" id="confettiButton" data-effect="confetti" aria-label="Play confetti, open palm gesture"><span class="gesture-emoji" aria-hidden="true">✋</span><span>Confetti</span></button>
          <button class="reaction-button" id="balloonsButton" data-effect="balloons" aria-label="Play balloons, peace sign gesture"><span class="gesture-emoji" aria-hidden="true">✌️</span><span>Balloons</span></button>
        </div>
        <div class="toolbar" aria-label="Camera controls">
          <div class="toolbar-actions">
            <button id="mirrorButton" class="tool-button" aria-pressed="true" aria-label="Mirror preview" title="Mirror preview"><svg aria-hidden="true"><use href="#mirror-icon"/></svg></button>
            <button id="clearButton" class="tool-button" aria-label="Clear effects" title="Clear effects"><svg aria-hidden="true"><use href="#clear-icon"/></svg></button>
            <button id="fullscreenButton" class="tool-button" aria-label="Enter fullscreen" title="Fullscreen"><svg aria-hidden="true"><use href="#expand-icon"/></svg></button>
          </div>
          <label class="gesture-setting" for="gestureToggle"><span>Gestures</span><input type="checkbox" role="switch" id="gestureToggle" checked></label>
        </div>
      </section>
    </main>
  </div>
  <dialog id="helpDialog" aria-labelledby="helpTitle">
    <button id="closeHelp" class="dialog-close" aria-label="Close guide">×</button>
    <h2 id="helpTitle">Hold for 1 second</h2>
    <p class="help-moves">✋ Confetti<br>✌️ Balloons</p>
    <p>Lower your hand to go again.<br>Or tap a move.</p>
    <p class="dialog-privacy">Camera only. Stays on your device.</p>
    <button id="gotItButton" class="primary-button">Got it</button>
  </dialog>
</body>
</html>
